openapi: 3.1.0
info:
  title: LoopForge API — Plan 2 slice (Goal → Clarify → Loop Spec)
  version: 0.2.0
  description: >
    Shared contract between the frontend (Claude) and backend (Codex). This is the
    single source of truth for the Goal → Clarification → Loop Spec flow. Neither side
    changes a schema or path without a contract renegotiation (see docs/contract/README.md).
    Schemas mirror api/loopforge/domain.py; reuse those Pydantic models server-side.

servers:
  - url: http://localhost:8000
    description: Local dev API

paths:
  /api/goals:
    get:
      operationId: listGoals
      summary: List goals (most recent first)
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Goal" }
    post:
      operationId: createGoal
      summary: Create a goal and run the clarity check
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalCreate" }
      responses:
        "201":
          description: >
            Goal created. If the goal needs clarification, `clarification` is present and
            `loop_spec` is null. If it was clear enough, `loop_spec` is present.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalCreateResult" }

  /api/goals/{goalId}:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGoal
      summary: Get a single goal
      responses:
        "200":
          description: Goal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/goals/{goalId}/clarification:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getClarification
      summary: Get the active clarification session for a goal
      responses:
        "200":
          description: Clarification session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClarificationSession" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/goals/{goalId}/clarification/answers:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    post:
      operationId: submitClarificationAnswer
      summary: Submit an answer to a clarification question
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClarificationAnswer" }
      responses:
        "200":
          description: >
            Updated session. When clarity is sufficient and no blocking gaps remain,
            `loop_spec` is present (generated) and the session `status` becomes "ready".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClarificationResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/loop-specs:
    get:
      operationId: listLoopSpecs
      summary: List loop specs, optionally filtered by goal
      parameters:
        - { name: goal_id, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Loop specs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoopSpec" }

  /api/loop-specs/{specId}:
    parameters:
      - { name: specId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getLoopSpec
      summary: Get a loop spec
      responses:
        "200":
          description: Loop spec
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoopSpec" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateLoopSpec
      summary: Edit a draft loop spec (builder/form edits) → new version
      description: >
        Server MUST re-run graph validation and MUST reject tool permissions that violate
        the goal's capability toggles (e.g. internet in offline_local). Returns the updated
        spec on success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoopSpecUpdate" }
      responses:
        "200":
          description: Updated loop spec
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoopSpec" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/loop-specs/{specId}/approve:
    parameters:
      - { name: specId, in: path, required: true, schema: { type: string } }
    post:
      operationId: approveLoopSpec
      summary: Approve a loop spec so it can be run
      responses:
        "200":
          description: Approved loop spec (status = "approved")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoopSpec" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Spec not in an approvable state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/goals/{goalId}/runs:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    post:
      operationId: startRun
      summary: Start a run from an approved loop spec
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunStartRequest" }
      responses:
        "201":
          description: Run started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "409":
          description: Loop spec not approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/runs:
    get:
      operationId: listRuns
      summary: List runs (most recent first)
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }

  /api/runs/{runId}:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRun
      summary: Get a run (status + spend + summary)
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{runId}/cancel:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    post:
      operationId: cancelRun
      summary: Cancel a running loop (tears down the in-flight sandbox)
      responses:
        "200":
          description: Updated run (status = cancelled)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{runId}/pause:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    post:
      operationId: pauseRun
      summary: Pause a running loop at the next safe boundary
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{runId}/events:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      operationId: streamRunEvents
      summary: Server-Sent Events stream of run events
      description: >
        Returns `text/event-stream`. Each SSE message `data:` is a JSON `RunEvent`.
        Event `type` is one of: node_start, node_end, tool_call, llm_call, cost_update,
        gate_pending, run_status. The stream replays existing events (ordered by `seq`)
        then streams new ones live, and ends when the run reaches a terminal status.
        For non-streaming clients/tests, the same events are also returned as a JSON array
        when the request `Accept` header is `application/json`.
      responses:
        "200":
          description: Event stream (or JSON array when Accept is application/json)
          content:
            text/event-stream:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunEvent" }

  /api/gates:
    get:
      operationId: listGates
      summary: List gates, optionally filtered by status
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, approved, rejected] }
        - name: run_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Gates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Gate" }

  /api/gates/{gateId}/decision:
    parameters:
      - { name: gateId, in: path, required: true, schema: { type: string } }
    post:
      operationId: decideGate
      summary: Approve or reject a pending HITL gate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GateDecision" }
      responses:
        "200":
          description: Updated gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gate" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Gate already decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/runs/{runId}/artifacts:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listArtifacts
      summary: List artifacts produced by a run
      responses:
        "200":
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Artifact" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{runId}/results:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getResults
      summary: Validated results for a finished run (insights + models + summary)
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Results" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{runId}/context:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRunContext
      summary: Context ledger + the current context pack for a run
      responses:
        "200":
          description: Run context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunContext" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/templates:
    get:
      operationId: listTemplates
      summary: List saved loop templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoopTemplate" }
    post:
      operationId: createTemplate
      summary: Save a loop spec as a reusable template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoopTemplateCreate" }
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoopTemplate" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/templates/{templateId}:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteTemplate
      summary: Delete a template
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/templates/{templateId}/instantiate:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string } }
    post:
      operationId: instantiateTemplate
      summary: Create a new draft loop spec from a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal_id]
              properties:
                goal_id: { type: string }
      responses:
        "201":
          description: New draft loop spec
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoopSpec" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/artifacts/{artifactId}/content:
    parameters:
      - { name: artifactId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getArtifactContent
      summary: Fetch the text content of an artifact (code, report, insight, etc.)
      description: >
        Returns the artifact's text body so the UI can view/extract it (e.g. generated code).
        PII-masked. Binary artifacts (e.g. plots) may return an empty `content` with a
        `storage_ref` to fetch separately.
      responses:
        "200":
          description: Artifact content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactContent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/llm-providers:
    get:
      operationId: listLlmProviders
      summary: List configured LLM providers (API keys never returned)
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LLMProvider" }
    post:
      operationId: createLlmProvider
      summary: Add an LLM provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LLMProviderCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMProvider" }

  /api/llm-providers/{providerId}:
    parameters:
      - { name: providerId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getLlmProvider
      summary: Get one provider (no API key)
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMProvider" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateLlmProvider
      summary: Update a provider (api_key only changed if provided)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LLMProviderUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMProvider" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteLlmProvider
      summary: Delete a provider
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/llm-providers/{providerId}/test:
    parameters:
      - { name: providerId, in: path, required: true, schema: { type: string } }
    post:
      operationId: testLlmProvider
      summary: Test connectivity to the provider
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMTestResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/datasets:
    get:
      operationId: listDatasets
      summary: List uploaded datasets (samples are PII-masked)
      responses:
        "200":
          description: Datasets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dataset" }
    post:
      operationId: uploadDataset
      summary: Upload a CSV/Parquet dataset; profiled async, mounted read-only into the sandbox
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                name: { type: string, description: "Display name; defaults to the filename." }
      responses:
        "201":
          description: Created (status=uploaded|profiling until profiled)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "413": { $ref: "#/components/responses/ValidationError" }
        "415": { $ref: "#/components/responses/ValidationError" }

  /api/datasets/{datasetId}:
    parameters:
      - { name: datasetId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDataset
      summary: Get one dataset with its profile (PII-masked column samples)
      responses:
        "200":
          description: Dataset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDataset
      summary: Delete a dataset and its stored file
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/evaluators:
    get:
      operationId: listEvaluators
      summary: List evaluators (frozen success metrics the loop can optimize)
      responses:
        "200":
          description: Evaluators
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Evaluator" }
    post:
      operationId: createEvaluator
      summary: Define an evaluator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluatorCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluator" }

  /api/evaluators/{evaluatorId}:
    parameters:
      - { name: evaluatorId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEvaluator
      summary: Get one evaluator
      responses:
        "200":
          description: Evaluator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluator" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateEvaluator
      summary: Update an evaluator (only before a run has frozen it)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluatorUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluator" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteEvaluator
      summary: Delete an evaluator
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Graph or permission validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    GoalMode:
      type: string
      enum: [offline_local, online_enabled]

    AutonomyLevel:
      type: string
      description: >
        How short the leash is (Karpathy's autonomy slider). Maps to the HITL gates the
        planner inserts: manual=gate every stage, checkpointed=before training+finalize,
        supervised=before finalize only, autonomous=no gates (runs to budget).
      enum: [manual, checkpointed, supervised, autonomous]

    RunStatus:
      type: string
      enum:
        [completed, needs_clarification, blocked, budget_exhausted, failed,
         cancelled, unsafe_request, context_overflow, running, pending_approval]

    GoalToggles:
      type: object
      required: [internet, code_sandbox, local_connectors]
      properties:
        internet: { type: boolean, default: false }
        code_sandbox: { type: boolean, default: true }
        local_connectors: { type: boolean, default: true }

    Budget:
      type: object
      required: [max_steps, max_llm_calls, max_context_tokens]
      properties:
        max_steps: { type: integer, minimum: 1, default: 12 }
        max_llm_calls: { type: integer, minimum: 0, default: 20 }
        max_context_tokens: { type: integer, minimum: 512, default: 8000 }

    GoalCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 3 }
        mode: { $ref: "#/components/schemas/GoalMode" }
        toggles: { $ref: "#/components/schemas/GoalToggles" }
        constraints: { type: object, additionalProperties: true }
        budget: { $ref: "#/components/schemas/Budget" }
        llm_provider_id:
          anyOf: [{ type: string }, { type: "null" }]
          description: Provider to run this goal with; null = the configured default.
        dataset_id:
          anyOf: [{ type: string }, { type: "null" }]
          description: Dataset to mount read-only into the sandbox; null = none / DB-only.
        evaluator_id:
          anyOf: [{ type: string }, { type: "null" }]
          description: Frozen success metric the loop optimizes; null = the default evaluator.
        autonomy:
          $ref: "#/components/schemas/AutonomyLevel"

    Goal:
      allOf:
        - $ref: "#/components/schemas/GoalCreate"
        - type: object
          required: [id, status, created_at]
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/RunStatus" }
            created_at: { type: string, format: date-time }

    GoalCreateResult:
      type: object
      required: [goal]
      properties:
        goal: { $ref: "#/components/schemas/Goal" }
        clarification:
          anyOf:
            - { $ref: "#/components/schemas/ClarificationSession" }
            - { type: "null" }
        loop_spec:
          anyOf:
            - { $ref: "#/components/schemas/LoopSpec" }
            - { type: "null" }

    ClarificationQuestion:
      type: object
      required: [id, question, missing_requirement, options]
      properties:
        id: { type: string }
        question: { type: string }
        missing_requirement: { type: string }
        options:
          type: array
          items: { type: string }
          description: Suggested selectable answers (2-4); the user may also enter their own.

    ClarificationSession:
      type: object
      required: [id, goal_id, questions, answers, missing_requirements, clarity_score, status]
      properties:
        id: { type: string }
        goal_id: { type: string }
        questions:
          type: array
          items: { $ref: "#/components/schemas/ClarificationQuestion" }
        answers:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
        missing_requirements:
          type: array
          items: { type: string }
        clarity_score: { type: number, minimum: 0, maximum: 1 }
        status:
          type: string
          enum: [open, ready]
          description: "open = more questions; ready = loop spec generated"

    ClarificationAnswer:
      type: object
      required: [question_id, answer]
      properties:
        question_id: { type: string }
        answer: { type: string }

    ClarificationResult:
      type: object
      required: [clarification]
      properties:
        clarification: { $ref: "#/components/schemas/ClarificationSession" }
        loop_spec:
          anyOf:
            - { $ref: "#/components/schemas/LoopSpec" }
            - { type: "null" }

    ToolPermission:
      type: object
      required: [tool_name, enabled, reason]
      properties:
        tool_name: { type: string }
        enabled: { type: boolean }
        reason: { type: string }

    LoopSpecAgent:
      type: object
      required: [name, role, system_prompt, tools]
      properties:
        name: { type: string }
        role: { type: string }
        system_prompt: { type: string }
        tools:
          type: array
          items: { type: string }

    LoopSpec:
      type: object
      required:
        [id, goal_id, version, agents, tool_permissions, handoffs, success_criteria,
         failure_criteria, gates, context_policy, improvement_strategy, status, created_at]
      properties:
        id: { type: string }
        goal_id: { type: string }
        version: { type: integer, minimum: 1 }
        agents:
          type: array
          items: { $ref: "#/components/schemas/LoopSpecAgent" }
        tool_permissions:
          type: array
          items: { $ref: "#/components/schemas/ToolPermission" }
        handoffs:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
        success_criteria: { type: array, items: { type: string } }
        failure_criteria: { type: array, items: { type: string } }
        gates: { type: array, items: { type: string } }
        context_policy: { type: object, additionalProperties: true }
        improvement_strategy: { type: string }
        status:
          type: string
          enum: [draft, approved, rejected]
        created_at: { type: string, format: date-time }

    LoopSpecUpdate:
      type: object
      description: Partial update; any provided field replaces the existing one.
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/LoopSpecAgent" }
        tool_permissions:
          type: array
          items: { $ref: "#/components/schemas/ToolPermission" }
        handoffs:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
        success_criteria: { type: array, items: { type: string } }
        failure_criteria: { type: array, items: { type: string } }
        gates: { type: array, items: { type: string } }
        context_policy: { type: object, additionalProperties: true }
        improvement_strategy: { type: string }

    RunStartRequest:
      type: object
      required: [loop_spec_id]
      properties:
        loop_spec_id: { type: string }

    Run:
      type: object
      required: [id, goal_id, loop_spec_id, status, spent_steps, spent_llm_calls]
      properties:
        id: { type: string }
        goal_id: { type: string }
        loop_spec_id: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        spent_steps: { type: integer }
        spent_llm_calls: { type: integer }
        spent_usd:
          anyOf: [{ type: number }, { type: "null" }]
        result_summary:
          anyOf: [{ type: string }, { type: "null" }]
        started_at:
          anyOf: [{ type: string, format: date-time }, { type: "null" }]
        ended_at:
          anyOf: [{ type: string, format: date-time }, { type: "null" }]

    RunEvent:
      type: object
      required: [id, run_id, seq, type, message, payload, created_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        seq: { type: integer }
        type:
          type: string
          enum: [node_start, node_end, tool_call, llm_call, cost_update, gate_pending, run_status]
        message: { type: string }
        payload:
          type: object
          additionalProperties: true
          description: >
            Type-specific fields consumed by the UI:
            node_start/node_end → { agent }; tool_call → { tool, agent? };
            llm_call → { agent?, tokens?, usd? };
            cost_update → { spent_usd?, spent_steps?, context_tokens? };
            gate_pending → { gate_id, gate_type }; run_status → { status }.
        created_at: { type: string, format: date-time }

    Gate:
      type: object
      required: [id, run_id, gate_type, status, context]
      properties:
        id: { type: string }
        run_id: { type: string }
        gate_type: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        context: { type: object, additionalProperties: true }
        note:
          anyOf: [{ type: string }, { type: "null" }]

    GateDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: string }

    Artifact:
      type: object
      required: [id, run_id, kind, metadata, created_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        kind: { type: string, enum: [insight, model, code, plot, report] }
        metadata: { type: object, additionalProperties: true }
        storage_ref:
          anyOf: [{ type: string }, { type: "null" }]
        created_at: { type: string, format: date-time }

    InsightResult:
      type: object
      required: [id, rank, claim, passed, test, p_value, effect_name, effect_value, n]
      properties:
        id: { type: string }
        rank: { type: integer }
        claim: { type: string }
        passed: { type: boolean }
        test: { type: string }
        p_value: { type: number }
        effect_name: { type: string }
        effect_value: { type: number }
        n: { type: integer }
        correction:
          anyOf: [{ type: string }, { type: "null" }]
        plot_ref:
          anyOf: [{ type: string }, { type: "null" }]

    ModelResult:
      type: object
      required: [id, name, metric_name, metric_value, baseline_name, baseline_value, beats_baseline, leakage_ok]
      properties:
        id: { type: string }
        name: { type: string }
        metric_name: { type: string }
        metric_value: { type: number }
        baseline_name: { type: string }
        baseline_value: { type: number }
        beats_baseline: { type: boolean }
        leakage_ok: { type: boolean }

    Results:
      type: object
      required: [run_id, status, summary, insights, models]
      properties:
        run_id: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        summary:
          type: object
          required: [validated, rejected]
          properties:
            validated: { type: integer }
            rejected: { type: integer }
            cost_usd:
              anyOf: [{ type: number }, { type: "null" }]
            duration_s:
              anyOf: [{ type: number }, { type: "null" }]
        insights:
          type: array
          items: { $ref: "#/components/schemas/InsightResult" }
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelResult" }

    ContextEntry:
      type: object
      required: [id, run_id, kind, text, tags, token_count, created_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        kind: { type: string }
        text: { type: string }
        tags: { type: array, items: { type: string } }
        source_event_id:
          anyOf: [{ type: string }, { type: "null" }]
        token_count: { type: integer }
        created_at: { type: string, format: date-time }

    ContextPack:
      type: object
      required: [entries, summary, token_count, overflow]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/ContextEntry" }
        summary: { type: string }
        token_count: { type: integer }
        overflow: { type: boolean }

    RunContext:
      type: object
      required: [ledger, pack]
      properties:
        ledger:
          type: array
          items: { $ref: "#/components/schemas/ContextEntry" }
        pack: { $ref: "#/components/schemas/ContextPack" }

    LoopTemplate:
      type: object
      required:
        [id, name, agents, tool_permissions, handoffs, success_criteria,
         failure_criteria, gates, context_policy, improvement_strategy, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        description:
          anyOf: [{ type: string }, { type: "null" }]
        agents:
          type: array
          items: { $ref: "#/components/schemas/LoopSpecAgent" }
        tool_permissions:
          type: array
          items: { $ref: "#/components/schemas/ToolPermission" }
        handoffs:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
        success_criteria: { type: array, items: { type: string } }
        failure_criteria: { type: array, items: { type: string } }
        gates: { type: array, items: { type: string } }
        context_policy: { type: object, additionalProperties: true }
        improvement_strategy: { type: string }
        created_at: { type: string, format: date-time }

    LoopTemplateCreate:
      type: object
      required: [name, spec_id]
      properties:
        name: { type: string }
        description: { type: string }
        spec_id:
          type: string
          description: Loop spec to snapshot into the template.

    ArtifactContent:
      type: object
      required: [artifact_id, content]
      properties:
        artifact_id: { type: string }
        filename:
          anyOf: [{ type: string }, { type: "null" }]
        language:
          anyOf: [{ type: string }, { type: "null" }]
        content: { type: string }

    LLMProviderKind:
      type: string
      enum: [openai_compatible, anthropic]

    LLMProvider:
      type: object
      description: API keys are never returned; `has_api_key` indicates one is stored.
      required: [id, name, kind, model, is_default, has_api_key, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/LLMProviderKind" }
        base_url:
          anyOf: [{ type: string }, { type: "null" }]
        model: { type: string }
        timeout_seconds: { type: number }
        is_default: { type: boolean }
        has_api_key: { type: boolean }
        created_at: { type: string, format: date-time }

    LLMProviderCreate:
      type: object
      required: [name, kind, model]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/LLMProviderKind" }
        base_url: { type: string }
        model: { type: string }
        api_key: { type: string }
        timeout_seconds: { type: number }
        is_default: { type: boolean }

    LLMProviderUpdate:
      type: object
      description: Any provided field replaces the existing one; omit api_key to keep it.
      properties:
        name: { type: string }
        base_url: { type: string }
        model: { type: string }
        api_key: { type: string }
        timeout_seconds: { type: number }
        is_default: { type: boolean }

    LLMTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        detail:
          anyOf: [{ type: string }, { type: "null" }]
        model:
          anyOf: [{ type: string }, { type: "null" }]

    DatasetKind:
      type: string
      enum: [csv, parquet]

    DatasetStatus:
      type: string
      enum: [uploaded, profiling, ready, failed]

    DatasetColumn:
      type: object
      description: Sample values MUST be PII-masked before leaving the server.
      required: [name, dtype, null_count, unique_count, sample, pii_masked]
      properties:
        name: { type: string }
        dtype: { type: string }
        null_count: { type: integer }
        unique_count: { type: integer }
        sample:
          type: array
          items: { type: string }
        pii_masked: { type: boolean }

    DatasetProfile:
      type: object
      required: [row_count, column_count, columns]
      properties:
        row_count: { type: integer }
        column_count: { type: integer }
        columns:
          type: array
          items: { $ref: "#/components/schemas/DatasetColumn" }

    EvaluatorKind:
      type: string
      description: >
        statistical_insight = significance + effect size + multiple-comparison correction;
        ml_baseline = beat a baseline on held-out data + leakage check; custom_metric = a
        user metric computed by sandbox code; llm_rubric = an LLM judges against a rubric.
      enum: [statistical_insight, ml_baseline, custom_metric, llm_rubric]

    EvaluatorDirection:
      type: string
      enum: [minimize, maximize]

    Evaluator:
      type: object
      description: A frozen success metric the loop optimizes (Karpathy's immutable yardstick, generalized).
      required: [id, name, kind, is_default, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/EvaluatorKind" }
        metric_name:
          anyOf: [{ type: string }, { type: "null" }]
        direction:
          anyOf:
            - { $ref: "#/components/schemas/EvaluatorDirection" }
            - { type: "null" }
        target:
          anyOf: [{ type: number }, { type: "null" }]
          description: Threshold that counts as "winning"; null = beat baseline / pass validation.
        config:
          type: object
          additionalProperties: true
          description: Kind-specific settings (alpha & correction; baseline & leakage; rubric).
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }

    EvaluatorCreate:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/EvaluatorKind" }
        metric_name: { type: string }
        direction: { $ref: "#/components/schemas/EvaluatorDirection" }
        target: { type: number }
        config: { type: object, additionalProperties: true }
        is_default: { type: boolean }

    EvaluatorUpdate:
      type: object
      properties:
        name: { type: string }
        metric_name: { type: string }
        direction: { $ref: "#/components/schemas/EvaluatorDirection" }
        target: { type: number }
        config: { type: object, additionalProperties: true }
        is_default: { type: boolean }

    Dataset:
      type: object
      required: [id, name, filename, kind, size_bytes, status, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        filename: { type: string }
        kind: { $ref: "#/components/schemas/DatasetKind" }
        size_bytes: { type: integer }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        profile:
          anyOf:
            - { $ref: "#/components/schemas/DatasetProfile" }
            - { type: "null" }
        detail:
          anyOf: [{ type: string }, { type: "null" }]
          description: Error or status detail (e.g. why profiling failed).
        created_at: { type: string, format: date-time }
